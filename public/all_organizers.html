<!DOCTYPE html>
<html lang="en" ng-app="orgApp" ng-controller="orgCtrl">
  <head>
    <meta charset="UTF-8" />
    <title>All Registered Organizers</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body {
        background-color: #f5f5f5;
        padding-top: 80px;
      }
      .table thead {
        background-color: #212529;
        color: white;
      }
      .header-title {
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
        color: #212529;
      }
      .refresh-btn {
        float: right;
        margin-bottom: 10px;
      }
      .organizer-img {
        width: 180px;
        height: 80px;
        object-fit: cover;
        border-radius: 10px;
      }
      nav {
        background-color: #8b0000;
      }
      nav .navbar-brand {
        font-weight: bold;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark fixed-top shadow">
      <div class="container">
        <span class="navbar-brand">Registered Organizers Console</span>
      </div>
    </nav>

    <div class="container mt-4">
      <h3 class="header-title">All Registered Organizers</h3>
      <table class="table table-bordered shadow-sm bg-white mt-3">
        <thead>
          <tr>
            <th>Sr. No</th>
            <th>Email ID</th>
            <th>Organization Name</th>
            <th>Registration Number</th>
            <th>Contact Number</th>
            <th>Sports</th>
            <th>Registration Certificate</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="org in organizers">
            <td>{{$index + 1}}</td>
            <td>{{org.emailid}}</td>
            <td>{{org.orgname}}</td>
            <td>{{org.regnumber}}</td>
            <td>{{org.contact}}</td>
            <td>{{org.sports}}</td>
            <td>
              <img ng-src="{{org.picurl}}" class="organizer-img" alt="No Pic" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      var app = angular.module("orgApp", []);
      app.controller("orgCtrl", function ($scope, $http) {
        $scope.loadOrganizers = function () {
          $http.get("/get-all-organizers").then(
            function (res) {
              $scope.organizers = res.data;
            },
            function () {
              alert(" Failed to load organizers");
            }
          );
        };
        $scope.loadOrganizers();
      });
    </script>
  </body>
</html>
