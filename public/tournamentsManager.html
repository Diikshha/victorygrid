<!DOCTYPE html>
<html lang="en" ng-app="tournamentApp">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Tournaments</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <style>
    :root {
      --midnight-navy: #0f172a;
      --golden-yellow: #facc15;
      --rich-burgundy: #7f1d1d;
      --soft-cream: #f8fafc;
    }

    * {
      font-family: "Inter", sans-serif;
    }

    .bg-midnight {
      background-color: var(--midnight-navy) !important;
    }

    .bg-softcream {
      background-color: var(--soft-cream) !important;
    }

    .bg-burgundy {
      background-color: var(--rich-burgundy) !important;
    }

    .text-golden {
      color: var(--golden-yellow) !important;
    }

    .text-cream {
      color: var(--soft-cream) !important;
    }

    footer {
      background-color: var(--rich-burgundy);
      color: var(--soft-cream);
      padding: 25px 0;
      margin-top: 50px;
    }
    .navbar-brand {
      margin-left: 30px;
      font-size: 25px;
    }
    .navbar-text {
      margin-right: 30px;
      font-size: 20px;
    }
  </style>
  <body ng-controller="tournamentController">
    <nav class="navbar navbar-dark bg-burgundy">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning">Manage Tournaments</a>
        <span class="navbar-text text-white">
          <span id="welcometxt"></span
        ></span>
      </div>
    </nav>

    <div class="container mt-4">
      <h2 class="text-center mb-4">Your Posted Tournaments</h2>

      <div class="mb-4">
        <label>Your Email ID</label>
        <input
          type="email"
          class="form-control mb-2"
          ng-model="email"
          id="emailid"
          readonly
        />
      </div>

      <div ng-if="tournaments.length > 0">
        <table class="table table-bordered table-hover">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Event</th>
              <th>Date</th>
              <th>Time</th>
              <th>City</th>
              <th>Sport</th>
              <th>Age</th>
              <th>Fee</th>
              <th>Prize</th>
              <th>Contact</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="t in tournaments track by $index">
              <td>{{$index+1}}</td>
              <td>{{t.event}}</td>
              <td>{{formatDate(t.doe)}}</td>
              <td>{{t.toe}}</td>
              <td>{{t.city}}</td>
              <td>{{t.sports}}</td>
              <td>{{t.minage}} - {{t.maxage}}</td>
              <td>₹{{t.fee}}</td>
              <td>₹{{t.prize}}</td>
              <td>{{t.contact}}</td>
              <td>
                <button
                  class="btn btn-sm btn-outline-danger"
                  ng-click="deleteTournament(t.rid)"
                >
                  Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div
        ng-if="tournaments.length == 0 && fetched"
        class="text-center text-muted"
      >
        No tournaments found for this account.
      </div>
    </div>

    <script>
      var app = angular.module("tournamentApp", []);
      app.controller("tournamentController", function ($scope, $http) {
        $scope.email = localStorage.getItem("activeUser") || "";
        document.getElementById("welcometxt").innerText = $scope.email;
        document.getElementById("emailid").value = $scope.email;
        $scope.tournaments = [];
        $scope.fetched = false;

        $scope.fetchTournaments = function () {
          if (!$scope.email) return alert("Email ID not found.");
          $http
            .get("/get-tournaments?emailid=" + encodeURIComponent($scope.email))
            .then(
              function (res) {
                $scope.tournaments = res.data;
                $scope.fetched = true;
              },
              function () {
                alert("Failed to fetch tournaments.");
              }
            );
        };

        $scope.deleteTournament = function (rid) {
          if (confirm("Are you sure you want to delete this tournament?")) {
            $http.delete("/delete-tournament?rid=" + rid).then(
              function () {
                alert("Tournament deleted.");
                $scope.fetchTournaments();
              },
              function () {
                alert("Delete failed!");
              }
            );
          }
        };

        $scope.formatDate = function (date) {
          return new Date(date).toLocaleDateString();
        };

        // Auto-fetch on load
        if ($scope.email) $scope.fetchTournaments();
      });
    </script>
  </body>
</html>
