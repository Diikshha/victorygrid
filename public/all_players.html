<!DOCTYPE html>
<html lang="en" ng-app="playerApp" ng-controller="playerCtrl">
  <head>
    <meta charset="UTF-8" />
    <title>All Registered Players</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      :root {
        --midnight-navy: #0f172a;
        --golden-yellow: #facc15;
        --rich-burgundy: #7f1d1d;
        --soft-cream: #f8fafc;
      }

      * {
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--soft-cream);
        padding-top: 80px;
        color: var(--soft-cream);
      }

      .navbar {
        background-color: var(--rich-burgundy);
      }

      .player-card {
        background-color: var(--midnight-navy);
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s;
      }

      .player-card:hover {
        transform: scale(1.02);
      }

      .player-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
      }

      .player-card .card-body {
        color: var(--soft-cream);
      }

      .btn-golden {
        background-color: var(--golden-yellow);
        color: var(--midnight-navy);
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-golden:hover {
        background-color: #e0b613;
      }

      .modal-content {
        background-color: var(--soft-cream);
        border-radius: 12px;
      }

      .modal-header {
        background-color: var(--rich-burgundy);
        color: var(--soft-cream);
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
      }

      .detail-img {
        width: 100%;
        height: 200px;
        object-fit: contain;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background-color: #fff;
      }

      .detail-list {
        list-style: none;
        padding: 0;
      }

      .detail-list li {
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
        color: var(--midnight-navy);
      }

      @media (max-width: 768px) {
        .modal-dialog {
          max-width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark fixed-top shadow">
      <div class="container">
        <span class="navbar-brand fw-bold text-golden fs-4"
          >All Registered Players</span
        >
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row g-4">
        <div class="col-md-4" ng-repeat="p in players track by $index">
          <div class="card player-card h-100">
            <img ng-src="{{p.profilepicurl}}" alt="Profile Picture" />
            <div class="card-body text-center">
              <h5 class="fw-bold">{{p.name}}</h5>
              <button
                class="btn btn-golden w-100 mt-3"
                data-bs-toggle="modal"
                data-bs-target="#modal{{$index}}"
              >
                View Full Details
              </button>
            </div>
          </div>
        </div>
      </div>

      <div ng-repeat="p in players track by $index">
        <div class="modal fade" id="modal{{$index}}" tabindex="-1">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content p-3">
              <div class="modal-header">
                <h5 class="modal-title">Player Details - {{p.name}}</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-5">
                    <img
                      ng-src="{{p.profilepicurl}}"
                      class="detail-img"
                      alt="Profile Pic"
                    />
                    <img
                      ng-src="{{p.acardpicurl}}"
                      class="detail-img"
                      alt="Aadhaar Pic"
                    />
                  </div>
                  <div class="col-md-7">
                    <ul class="detail-list">
                      <li><strong>Name:</strong> {{p.name}}</li>
                      <li><strong>Email ID:</strong> {{p.emailid}}</li>
                      <li><strong>DOB:</strong> {{p.dob}}</li>
                      <li><strong>Gender:</strong> {{p.gender}}</li>
                      <li><strong>Contact:</strong> {{p.contact}}</li>
                      <li><strong>Address:</strong> {{p.address}}</li>
                      <li><strong>Game:</strong> {{p.game}}</li>
                      <li><strong>Other Info:</strong> {{p.otherinfo}}</li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-golden" data-bs-dismiss="modal">
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var app = angular.module("playerApp", []);
      app.controller("playerCtrl", function ($scope, $http) {
        $scope.players = [];

        $scope.loadPlayers = function () {
          $http.get("/get-all-players").then(
            function (response) {
              $scope.players = response.data;
            },
            function () {
              alert(" Failed to load players");
            }
          );
        };

        $scope.loadPlayers();
      });
    </script>
  </body>
</html>
