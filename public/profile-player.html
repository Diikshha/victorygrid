<!DOCTYPE html>
<html lang="en" ng-app="playerApp" ng-controller="playerCtrl">
  <head>
    <meta charset="UTF-8" />
    <title>Player Profile Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <style>
      :root {
        --midnight-navy: #0f172a;
        --golden-yellow: #facc15;
        --rich-burgundy: #7f1d1d;
        --soft-cream: #f8fafc;
      }

      * {
        font-family: "Inter", sans-serif;
      }

      .bg-midnight {
        background-color: var(--midnight-navy) !important;
      }

      .bg-softcream {
        background-color: var(--soft-cream) !important;
      }

      .bg-burgundy {
        background-color: var(--rich-burgundy) !important;
      }

      .text-golden {
        color: var(--golden-yellow) !important;
      }

      .text-cream {
        color: var(--soft-cream) !important;
      }
      body {
        background-color: #f8f9fa;
        padding-top: 80px;
      }
      .form-container {
        max-width: 950px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }
      .img-preview {
        width: 250px;
        height: 170px;
        border: 1px solid #ddd;
        object-fit: cover;
      }
      .btn-dark:hover {
        background-color: #343a40;
      }
      .loading-box {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        color: white;
        font-size: 24px;
        font-weight: bold;
        z-index: 9999;
        display: none;
      }
      footer {
        background-color: var(--rich-burgundy);
        color: var(--soft-cream);
        padding: 25px 0;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div id="loadingBox" class="loading-box">Reading Aadhaar… Please wait</div>

    <nav
      class="navbar navbar-expand-lg navbar-dark bg-burgundy fixed-top shadow"
    >
      <div class="container">
        <a class="navbar-brand fw-bold text-warning">
          <span id="welcometxt"></span
        ></a>
      </div>
    </nav>

    <div class="form-container mt-4 mb-5 bg-softcream">
      <form id="playerForm" enctype="multipart/form-data" novalidate>
        <div class="mb-3">
          <label>Email ID</label>
          <input
            type="email"
            class="form-control"
            ng-model="emailid"
            id="emailid"
            readonly
            required
          />
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label>Aadhaar Card Front</label>
            <input
              type="file"
              class="form-control mb-2"
              id="acardpic"
              onchange="previewAndReadAadhaar(event)"
            />
            <img
              id="aadhaarPreview"
              src="https://via.placeholder.com/100x120?text=Aadhaar"
              class="img-preview mb-2"
            />
          </div>
          <div class="col-md-6">
            <label>Profile Picture</label>
            <input
              type="file"
              class="form-control mb-2"
              id="profilepic"
              onchange="previewImage(event, 'profilePreview')"
            />
            <img
              id="profilePreview"
              src="https://via.placeholder.com/100x120?text=Profile"
              class="img-preview mb-2"
            />
          </div>
        </div>

        <input type="hidden" ng-model="acardpicurl" />
        <input type="hidden" ng-model="profilepicurl" />

        <div class="row mb-3">
          <div class="col-md-6">
            <label>Name</label>
            <input type="text" class="form-control" ng-model="name" required />
          </div>
          <div class="col-md-6">
            <label>DOB</label>
            <input type="date" class="form-control" ng-model="dob" required />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label>Gender</label>
            <input
              type="text"
              class="form-control"
              ng-model="gender"
              readonly
              required
            />
          </div>
          <div class="col-md-6">
            <label>Contact Number</label>
            <input
              type="text"
              class="form-control"
              ng-model="contact"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label>Address</label>
          <input type="text" class="form-control" ng-model="address" required />
        </div>

        <div class="mb-3">
          <label>Interested Games</label>
          <select
            id="gameSelect"
            class="form-control selectpicker"
            data-live-search="true"
            data-size="7"
            required
          >
            <option value="">Select Game</option>
            <option value="Cricket">Cricket</option>
            <option value="Football">Football</option>
            <option value="Basketball">Basketball</option>
            <option value="Volleyball">Volleyball</option>
            <option value="Hockey">Hockey</option>
            <option value="Baseball">Baseball</option>
            <option value="Rugby">Rugby</option>
            <option value="American Football">American Football</option>
            <option value="Tennis">Tennis</option>
            <option value="Table Tennis">Table Tennis</option>
            <option value="Badminton">Badminton</option>
            <option value="Kabaddi">Kabaddi</option>
            <option value="Chess">Chess</option>
            <option value="Carrom">Carrom</option>
            <option value="Snooker">Snooker</option>
            <option value="Billiards">Billiards</option>
            <option value="Darts">Darts</option>
            <option value="Squash">Squash</option>
            <option value="Bowling">Bowling</option>
            <option value="Athletics">Athletics</option>
            <option value="Wrestling">Wrestling</option>
            <option value="Boxing">Boxing</option>
            <option value="Judo">Judo</option>
            <option value="Karate">Karate</option>
            <option value="Taekwondo">Taekwondo</option>
            <option value="Mixed Martial Arts">Mixed Martial Arts</option>
            <option value="Fencing">Fencing</option>
            <option value="Archery">Archery</option>
            <option value="Cycling">Cycling</option>
            <option value="Horse Racing">Horse Racing</option>
            <option value="Motor Racing">Motor Racing</option>
            <option value="Formula 1">Formula 1</option>
            <option value="Kart Racing">Kart Racing</option>
            <option value="Swimming">Swimming</option>
            <option value="Surfing">Surfing</option>
            <option value="Diving">Diving</option>
            <option value="Water Polo">Water Polo</option>
            <option value="Kayaking">Kayaking</option>
            <option value="Canoeing">Canoeing</option>
            <option value="Rowing">Rowing</option>
            <option value="Sailing">Sailing</option>
            <option value="Skydiving">Skydiving</option>
            <option value="Paragliding">Paragliding</option>
            <option value="Rock Climbing">Rock Climbing</option>
            <option value="Mountaineering">Mountaineering</option>
            <option value="Skiing">Skiing</option>
            <option value="Snowboarding">Snowboarding</option>
            <option value="Skateboarding">Skateboarding</option>
            <option value="Roller Skating">Roller Skating</option>
            <option value="Valorant">Valorant</option>
            <option value="Counter Strike">Counter Strike</option>
            <option value="PUBG">PUBG</option>
            <option value="Free Fire">Free Fire</option>
            <option value="Call of Duty">Call of Duty</option>
            <option value="Mobile Legends">Mobile Legends</option>
            <option value="Clash Royale">Clash Royale</option>
            <option value="League of Legends">League of Legends</option>
            <option value="Apex Legends">Apex Legends</option>
            <option value="Overwatch">Overwatch</option>
            <option value="Dota 2">Dota 2</option>
            <option value="FIFA (eFootball)">FIFA (eFootball)</option>
            <option value="Rocket League">Rocket League</option>
            <option value="Golf">Golf</option>
            <option value="Gymnastics">Gymnastics</option>
            <option value="Horse Riding">Horse Riding</option>
            <option value="Equestrian">Equestrian</option>
            <option value="Lawn Bowls">Lawn Bowls</option>
            <option value="Polo">Polo</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Other Info</label>
          <textarea
            class="form-control"
            rows="3"
            ng-model="otherinfo"
          ></textarea>
        </div>

        <div class="d-flex justify-content-between">
          <button
            type="button"
            class="btn btn-dark px-5"
            ng-click="savePlayer()"
          >
            Upload Data
          </button>
          <button
            type="button"
            class="btn btn-dark px-5"
            ng-click="modifyPlayer()"
          >
            Modify
          </button>
        </div>
      </form>
    </div>

    <footer class="py-4">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6">
            <p class="text-cream opacity-75 mb-0">© 2025 VictoryGrid</p>
          </div>
          <div class="col-md-6 text-md-end">
            <a href="#" class="text-cream opacity-75 text-decoration-none me-3"
              >About</a
            >
            <a href="#" class="text-cream opacity-75 text-decoration-none me-3"
              >Terms of Service</a
            >
            <a href="#" class="text-cream opacity-75 text-decoration-none me-3"
              >Conatct</a
            >
          </div>
        </div>
      </div>
    </footer>

    <script>
      var app = angular.module("playerApp", []);
      app.controller("playerCtrl", function ($scope, $http) {
        $scope.emailid = localStorage.getItem("activeUser") || "";
        document.getElementById("welcometxt").innerText = $scope.emailid;

        $(".selectpicker").selectpicker("render");

        $scope.getPlayer = function () {
          $http.get("/get-player?emailid=" + $scope.emailid).then(
            (res) => {
              let d = res.data;
              if (!d || Object.keys(d).length === 0) return;
              $scope.acardpicurl = d.acardpicurl;
              $scope.profilepicurl = d.profilepicurl;
              $scope.name = d.name;
              $scope.dob = d.dob ? new Date(formatDOB(d.dob.trim())) : null;
              $scope.gender = d.gender;
              $scope.contact = d.contact;
              $scope.address = d.address;
              $scope.game = (d.game || "").trim();
              $scope.otherinfo = d.otherinfo;
              $("#aadhaarPreview").attr("src", d.acardpicurl);
              $("#profilePreview").attr("src", d.profilepicurl);

              setTimeout(function () {
                $(".selectpicker").selectpicker("val", $scope.game);
              }, 100);
            },
            (err) => console.log("❌ Player not found")
          );
        };

        $scope.refreshPicker = function () {
          $(".selectpicker").selectpicker("refresh");
        };

        if ($scope.emailid) $scope.getPlayer();

        $scope.savePlayer = function () {
          let fd = new FormData();
          fd.append("emailid", $scope.emailid);
          fd.append("acardpicurl", $scope.acardpicurl || "");
          fd.append("name", $scope.name);
          fd.append("dob", formatForBackend($scope.dob));
          fd.append("gender", $scope.gender);
          fd.append("address", $scope.address);
          fd.append("contact", $scope.contact);
          fd.append("game", $("#gameSelect").val());
          fd.append("otherinfo", $scope.otherinfo);
          let prof = document.getElementById("profilepic").files[0];
          if (prof) fd.append("profilepic", prof);
          $http
            .post("/save-player", fd, {
              transformRequest: angular.identity,
              headers: { "Content-Type": undefined },
            })
            .then(
              (res) => {
                alert(res.data);
                $scope.getPlayer();
              },
              (err) => alert("❌ " + err.data)
            );
        };

        $scope.modifyPlayer = function () {
          let fd = new FormData();
          fd.append("emailid", $scope.emailid);
          fd.append("acardpicurl", $scope.acardpicurl || "");
          fd.append("existingProfilePic", $scope.profilepicurl || "");
          fd.append("name", $scope.name);
          fd.append("dob", formatForBackend($scope.dob));
          fd.append("gender", $scope.gender);
          fd.append("address", $scope.address);
          fd.append("contact", $scope.contact);
          fd.append("game", $("#gameSelect").val());
          fd.append("otherinfo", $scope.otherinfo);
          let prof = document.getElementById("profilepic").files[0];
          if (prof) fd.append("profilepic", prof);
          $http
            .post("/modify-player", fd, {
              transformRequest: angular.identity,
              headers: { "Content-Type": undefined },
            })
            .then(
              (res) => {
                alert(res.data);
                $scope.getPlayer();
              },
              (err) => alert("❌ " + err.data)
            );
        };
      });

      function formatDOB(dob) {
        if (!dob || dob.toLowerCase() === "null") return "";
        dob = dob.trim();
        if (dob.includes("/")) {
          let [dd, mm, yyyy] = dob.split("/");
          return `${yyyy}-${mm.padStart(2, "0")}-${dd.padStart(2, "0")}`;
        }
        if (dob.includes("T")) return dob.split("T")[0];
        return dob;
      }
      function formatForBackend(dob) {
        if (!dob) return "";
        if (typeof dob === "string") return formatDOB(dob);
        let dateObj = new Date(dob);
        if (isNaN(dateObj.getTime())) return "";
        return dateObj.toISOString().split("T")[0];
      }
      function previewAndReadAadhaar(event) {
        $("#loadingBox").show();
        let fd = new FormData();
        fd.append("acardpic", event.target.files[0]);
        $.ajax({
          url: "/read-aadhaar",
          type: "POST",
          data: fd,
          contentType: false,
          processData: false,
          success: function (data) {
            $("#loadingBox").hide();
            let $scope = angular
              .element(document.querySelector("[ng-controller=playerCtrl]"))
              .scope();
            $scope.acardpicurl = data.acardpicurl;
            $scope.name = (data.name || "").trim();
            $scope.dob = data.dob ? new Date(formatDOB(data.dob.trim())) : null;
            $scope.gender = (data.gender || "").trim();
            $("#aadhaarPreview").attr("src", data.acardpicurl);
            $scope.$apply();
          },
          error: function () {
            $("#loadingBox").hide();
            alert("❌ Failed to read Aadhaar!");
          },
        });
      }
      function previewImage(event, targetId) {
        let reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById(targetId).src = e.target.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    </script>
  </body>
</html>
